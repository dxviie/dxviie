name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    # The job commits these back; regenerating on its own commit is pointless.
    paths-ignore:
      - github-metrics.svg
      - README.md
  workflow_dispatch:

# The card is built in-repo from the GitHub API, so nothing third-party runs
# here and no long-lived token is handed to code we don't control.
permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Generate metrics card
        env:
          GITHUB_LOGIN: ${{ github.repository_owner }}
          # METRICS_TOKEN must be able to read private repositories, or their
          # languages are missing from the card: a classic PAT with `repo`, or a
          # fine-grained PAT with Metadata + Contents: Read on all repositories.
          # Without the secret this falls back to the ephemeral job token, which
          # sees public repositories only.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: node scripts/generate-metrics.mjs --out github-metrics.svg

      - name: Commit card
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each attempt rebuilds both commits on top of whatever main is now.
          # The README records a commit SHA, so the history it names has to be
          # the history that gets pushed — rebasing after the fact would leave
          # the README pointing at a commit that no longer exists.
          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --quiet --mixed FETCH_HEAD

            if git diff --quiet -- github-metrics.svg; then
              echo "Card unchanged; nothing to commit."
              exit 0
            fi

            git add github-metrics.svg
            git commit --quiet -m "chore: refresh metrics card [skip ci]"

            # Point the README at this exact commit rather than at the branch
            # with a ?v= query string. A query string only busts caches that key
            # on it; changing the path itself cannot be normalised away, so the
            # profile page is guaranteed to fetch the new card.
            SHA=$(git rev-parse HEAD)
            sed -i -E "s#(raw\.githubusercontent\.com/[^/]+/[^/]+)/[^/]+/github-metrics\.svg(\?[^)]*)?#\1/${SHA}/github-metrics.svg#" README.md
            git add README.md
            git commit --quiet -m "chore: point README at refreshed card [skip ci]"

            if git push --quiet origin HEAD:main; then
              echo "Pushed card at ${SHA}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying."
            sleep $((2 ** attempt))
          done
          exit 1
