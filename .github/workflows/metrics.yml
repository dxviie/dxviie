name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    # The job commits these back; regenerating on its own commit is pointless.
    paths-ignore:
      - github-metrics.svg
      - README.md
  workflow_dispatch:

# The card is built in-repo from the GitHub API, so nothing third-party runs
# here and no long-lived token is handed to code we don't control.
permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate metrics card
        env:
          GITHUB_LOGIN: ${{ github.repository_owner }}
          # The ephemeral job token is enough for public profile data. Set a
          # METRICS_TOKEN secret only to pick up private contribution counts;
          # a fine-grained PAT with no permissions selected is sufficient.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: node scripts/generate-metrics.mjs --out github-metrics.svg

      - name: Commit card
        run: |
          set -euo pipefail
          # Camo caches by URL, so the README query string has to move with it.
          TIMESTAMP=$(date +%s)
          sed -i -E "s|github-metrics\.svg(\?v=[0-9]+)?\)|github-metrics.svg?v=${TIMESTAMP})|" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg README.md
          if git diff --cached --quiet; then
            echo "No change to the metrics card."
            exit 0
          fi
          git commit -m "chore: refresh metrics card [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt ${attempt}); retrying."
            sleep $((2 ** attempt))
          done
          exit 1
